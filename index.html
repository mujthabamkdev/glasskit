<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Glasskit — a curated archive of liquid glass components and visual design.">
  <title>Glasskit — a curated archive of liquid glass</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="./assets/mark.svg">
  <script defer src="./dist/liquid-glass.global.js"></script>
  <script type="module" src="/src/ui-cards.js"></script>
  <script type="module" src="/src/glass-slider.js"></script>
  <script type="module" src="/src/postage-stamps.js"></script>
  <script type="module" src="/src/platinum-visa-card.js"></script>
  <script type="module" src="/src/plasma-app.js"></script>
  <script type="module" src="/src/portfolio-website.js"></script>
  <style>
    :root{--font-inter:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:var(--font-inter);background:#fff;color:#262626;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:inherit;text-decoration:none}
    button{font:inherit;cursor:pointer}
    input{font:inherit}
    img{display:block;max-width:100%}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

    /* Header */
    .site-header{position:sticky;top:0;z-index:40;height:72px;background:#fff;border-bottom:1px solid #f0f0f0}
    .site-header-inner{max-width:1705px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px}
    @media(min-width:640px){.site-header-inner{padding:0 20px}}
    @media(min-width:1024px){.site-header-inner{padding:0 24px}}
    @media(min-width:1700px){.site-header-inner{padding:0 46px}}
    .brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .brand-mark{display:block;width:28px;height:26px;color:#262626}
    .brand-name{font-size:18px;font-weight:600;letter-spacing:-0.02em;color:#262626}
    .primary-nav{display:none;align-items:center;gap:24px;font-size:16px;font-weight:500}
    @media(min-width:1440px){.primary-nav{display:flex}}
    .primary-nav a{color:#7b7b7b;transition:color .15s}
    .primary-nav a:hover{color:#262626}
    .primary-nav a.active{color:#262626}
    .header-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;min-width:0;flex:1;max-width:440px}
    @media(min-width:640px){.header-form{display:flex;gap:8px}}
    .header-form input[type=email]{height:40px;width:100%;min-width:0;border:1px solid #e6e6e6;background:#fafafa;border-radius:0;padding:0 11px;font-size:13px;color:#555;outline:none;transition:border-color .15s}
    .header-form input[type=email]::placeholder{color:#8b8b8b}
    .header-form input[type=email]:focus{border-color:#aaa}
    .header-form button{height:40px;flex-shrink:0;background:#262626;color:#fff;border:0;border-radius:0;padding:0 16px;font-size:13px;font-weight:500;transition:background .15s}
    .header-form button:hover{background:#000}
    .header-form .honeypot{display:none}

    /* Hero */
    .hero{max-width:1705px;margin:0 auto;padding:68px 16px 24px}
    @media(min-width:640px){.hero{padding:68px 20px 24px}}
    @media(min-width:1024px){.hero{padding:112px 24px 24px}}
    @media(min-width:1700px){.hero{padding:112px 46px 24px}}
    .hero-title{font-size:clamp(32px,6vw,56px);font-weight:700;letter-spacing:-0.03em;line-height:1.05;margin:0 0 12px;color:#111}
    .hero-sub{font-size:15px;line-height:1.6;color:#555;max-width:640px;margin:0 0 32px}

    /* Filters */
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 32px;align-items:center}
    .filter{font-size:13px;font-weight:500;padding:8px 14px;border:1px solid #e6e6e6;background:#fff;color:#555;border-radius:999px;transition:all .15s}
    .filter:hover{border-color:#aaa;color:#111}
    .filter.active{background:#262626;color:#fff;border-color:#262626}

    /* Masonry grid */
    .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start;max-width:1705px;margin:0 auto;padding:0 16px 64px}
    .grid-column{min-width:0}
    @media(min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 20px 64px}}
    @media(min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(min-width:1280px){.grid{padding:0 24px 64px}}
    @media(min-width:1700px){.grid{padding:0 46px 64px}}
    .card{break-inside:avoid;margin-bottom:14px;display:block;border-radius:12px;overflow:hidden;background:#f0f0f0;position:relative}
    .card img{width:100%;height:auto;display:block}
    .card-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.55));opacity:0;transition:opacity .2s}
    .card:hover .card-overlay{opacity:1}
    .card-title{color:#fff;font-size:14px;font-weight:600;letter-spacing:-0.01em;margin:0}
    .card-meta{color:rgba(255,255,255,.75);font-size:11px;margin-top:2px}

    /* Live recorder card */
    .card-live{background:#f2f5f6;color:#53606b}
    .recorder-preview{display:grid;place-items:center;min-height:300px;padding:32px 12px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);container-type:inline-size}
    .card-live liquid-recorder{width:100%;max-width:420px;--recorder-height:140px;--recorder-time-size:50px;--recorder-button-size:90px}
    @media(min-width:481px){
      .card-live liquid-recorder{--recorder-button-size:clamp(70px,25cqw,90px)}
      .card-live liquid-recorder::part(timer){font-size:clamp(24px,calc((100cqw - 190px)/2.8),50px)}
    }
    @media(max-width:360px){.recorder-preview{padding-inline:8px}.card-live liquid-recorder{--recorder-button-size:76px}}
    .card-live-ui{background:#f2f5f6;color:#53606b}
    .card-live-ui ui-cards-scene{width:100%}
    .card-live-slider{background:#f7f7f7;color:#53606b}
    .card-live-slider glass-slider-scene{width:100%}
    .ui-card-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid #e7ecef}
    .ui-card-footer h2{margin:0;font-size:12px;font-weight:600}
    .ui-card-footer a{font-size:11px;color:#68747e}
    .ui-card-footer a:hover{color:#111}
    .ui-card-footer a:focus-visible{outline:2px solid #626d7d;outline-offset:4px}
    .card-postage{background:#f7f7f7;color:#53606b}
    .card-postage postage-stamps-scene{width:100%}
    .card-visa{background:#f7f7f8;color:#53606b}
    .card-visa platinum-visa-card-scene{width:100%}
    .card-plasma{background:#f5f5f5;color:#53606b}
    .card-plasma plasma-app-scene{width:100%}
    .card-portfolio{background:#deeffb;color:#53606b}
    .card-portfolio portfolio-website-scene{width:100%}

    /* Footer */
    .site-footer{border-top:1px solid #eee;padding:32px 16px;font-size:12px;color:#888;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;max-width:1705px;margin:0 auto}
    @media(min-width:640px){.site-footer{padding:32px 20px}}
    @media(min-width:1024px){.site-footer{padding:32px 24px}}
    @media(min-width:1700px){.site-footer{padding:32px 46px}}
    .site-footer a{color:#555}
    .site-footer a:hover{color:#111}
  </style>
</head>
<body>
  <main class="min-h-[100dvh] w-full max-w-full overflow-x-clip bg-white">
    <header class="site-header">
      <div class="site-header-inner">
        <div style="display:flex;align-items:center;gap:24px;flex-shrink:0">
          <a aria-label="Glasskit home" href="/">Glasskit</a>
          <nav class="primary-nav" aria-label="Primary navigation">
            <a class="active" href="index.html">Explore</a>
            <a href="/demo">Glasskit demo</a>
            <a href="https://x.com/neropursue" target="_blank" rel="noopener noreferrer">Contact</a>
          </nav>
        </div>
        <form class="header-form" action="#" method="post" onsubmit="return false">
          <label class="sr-only" for="header-email">Email address</label>
          <input id="header-email" type="email" autocomplete="email" required placeholder="you@email.com" name="email">
          <input type="text" tabindex="-1" autocomplete="off" aria-hidden="true" class="honeypot" name="company">
          <button type="submit">subscribe</button>
        </form>
      </div>
    </header>

    <section class="hero">
      <h1 class="hero-title">Glasskit</h1>
      <p class="hero-sub">A curated archive of liquid glass components and visual design.</p>
      <div class="filters" role="tablist" aria-label="Filter by category">
        <button class="filter active" data-cat="all">All</button>
        <button class="filter" data-cat="web">Web</button>
        <button class="filter" data-cat="branding">Branding</button>
        <button class="filter" data-cat="product">Product</button>
        <button class="filter" data-cat="motion">Motion</button>
        <button class="filter" data-cat="illustration">Illustration</button>
        <button class="filter" data-cat="3d">3D</button>
        <button class="filter" data-cat="print">Print</button>
        <button class="filter" data-cat="latest">Latest</button>
      </div>
    </section>

    <div class="grid" id="grid"></div>

    <footer class="site-footer">
      <span>© 2026 Glasskit — curated archive</span>
      <span><a href="/demo">Glasskit demo</a> · <a href="https://x.com/neropursue" target="_blank" rel="noopener noreferrer">Contact</a></span>
    </footer>
  </main>

  <script>
    const posts = [
      { title: 'Visual identity', meta: 'Branding · 2026', cat: 'branding', img: './assets/land-1.svg', ratio: '3/4' },
      { title: 'Editorial layout', meta: 'Print · 2026', cat: 'print', img: './assets/land-2.svg', ratio: '4/3' },
      { title: 'Interface design', meta: 'Product · 2026', cat: 'product', img: './assets/land-3.svg', ratio: '4/3' },
      { title: 'Motion graphics', meta: 'Motion · 2026', cat: 'motion', img: './assets/land-4.svg', ratio: '3/4' },
      { title: 'Digital product', meta: 'Web · 2026', cat: 'web', img: './assets/land-5.svg', ratio: '4/3' },
      { title: 'Type specimen', meta: 'Illustration · 2026', cat: 'illustration', img: './assets/land-6.svg', ratio: '3/4' },
      { title: 'Spatial render', meta: '3D · 2026', cat: '3d', img: './assets/land-1.svg', ratio: '1/1' },
      { title: 'Web experience', meta: 'Web · 2026', cat: 'web', img: './assets/land-2.svg', ratio: '4/3' },
      { title: 'Brand system', meta: 'Branding · 2026', cat: 'branding', img: './assets/land-3.svg', ratio: '3/4' },
      { title: 'Motion study', meta: 'Motion · 2026', cat: 'motion', img: './assets/land-4.svg', ratio: '4/3' },
      { title: 'Print editorial', meta: 'Print · 2026', cat: 'print', img: './assets/land-5.svg', ratio: '3/4' },
      { title: 'Illustration set', meta: 'Illustration · 2026', cat: 'illustration', img: './assets/land-6.svg', ratio: '4/3' }
    ];

    const grid = document.getElementById('grid');
    let galleryCards = [];
    function render(cat) {
      grid.innerHTML = '';
      const filtered = cat === 'all' || cat === 'latest' ? posts : posts.filter(p => p.cat === cat);
      const list = cat === 'latest' ? [...posts].reverse() : filtered;
      list.forEach(p => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = p.href ? p.href : '#';
        a.style.aspectRatio = p.ratio;
        a.dataset.ratio = p.ratio;
        a.innerHTML = `<img src="${p.img}" alt="${p.title}" loading="lazy"><div class="card-overlay"><p class="card-title">${p.title}</p><p class="card-meta">${p.meta}</p></div>`;
        grid.appendChild(a);
      });
      // Insert the live liquid-recorder card as the FIRST item (only on "all"/"latest")
      if (cat === 'all' || cat === 'latest') {
        const live = document.createElement('article');
        live.className = 'card card-live';
        live.innerHTML = `<div class="recorder-preview"><liquid-recorder demo blur="2" refraction="64" elasticity="1.35" download-name="glasskit-recording"></liquid-recorder></div><div class="ui-card-footer"><h2>Liquid Recorder</h2><a href="/demo">View full page ↗</a></div>`;
        grid.insertBefore(live, grid.firstChild);
      }
      // The second gallery item uses the same rendered scene as the full demo.
      if (cat === 'all' || cat === 'latest' || cat === 'motion') {
        const uiCard = document.createElement('article');
        uiCard.className = 'card card-live-ui';
        uiCard.innerHTML = `<ui-cards-scene preview aria-label="Live UI cards preview"></ui-cards-scene><div class="ui-card-footer"><h2>UI cards</h2><a href="/ui-cards">View full page ↗</a></div>`;
        grid.insertBefore(uiCard, cat === 'motion' ? grid.firstChild : grid.children[1]);
      }
      // Keep the glass slider third, with a live scene rather than a sample image.
      if (cat === 'all' || cat === 'latest' || cat === 'product') {
        const sliderCard = document.createElement('article');
        sliderCard.className = 'card card-live-slider';
        sliderCard.innerHTML = `<glass-slider-scene preview aria-label="Live glass slider preview"></glass-slider-scene><div class="ui-card-footer"><h2>Glass slider experiment</h2><a href="/glass-slider">View full page ↗</a></div>`;
        grid.insertBefore(sliderCard, cat === 'product' ? grid.firstChild : grid.children[2]);
      }
      if (cat === 'all' || cat === 'latest' || cat === 'print') {
        const stamps = document.createElement('article');
        stamps.className = 'card card-postage';
        stamps.dataset.ratio = '1/1';
        stamps.innerHTML = `<postage-stamps-scene preview aria-label="Live postage stamps preview"></postage-stamps-scene><div class="ui-card-footer"><h2>Postage Stamps</h2><a href="/postage-stamps">View full page ↗</a></div>`;
        grid.insertBefore(stamps, grid.querySelector('.card:not([class*="card-live"])'));
      }
      if (cat === 'all' || cat === 'latest' || cat === 'illustration') {
        const visa = document.createElement('article');
        visa.className = 'card card-visa';
        visa.dataset.ratio = '4/3';
        visa.innerHTML = `<platinum-visa-card-scene preview aria-label="Live platinum Visa card preview"></platinum-visa-card-scene><div class="ui-card-footer"><h2>Platinum Visa Card</h2><a href="/platinum-visa-card">View full page ↗</a></div>`;
        const stamps = grid.querySelector('.card-postage');
        grid.insertBefore(visa, stamps ? stamps.nextSibling : grid.querySelector('.card:not([class*="card-live"])'));
      }
      if (cat === 'all' || cat === 'latest' || cat === 'product') {
        const plasma = document.createElement('article');
        plasma.className = 'card card-plasma';
        plasma.dataset.ratio = '1/1';
        plasma.innerHTML = `<plasma-app-scene preview autoplay aria-label="Live Plasma app demo wallet"></plasma-app-scene><div class="ui-card-footer"><h2>Plasma App</h2><a href="/plasma-app">View full page ↗</a></div>`;
        const previous = grid.querySelector('.card-visa') || grid.querySelector('.card-postage');
        grid.insertBefore(plasma, previous ? previous.nextSibling : grid.querySelector('.card:not([class*="card-live"])'));
      }
      if (cat === 'all' || cat === 'latest' || cat === 'web') {
        const portfolio = document.createElement('article');
        portfolio.className = 'card card-portfolio';
        portfolio.dataset.ratio = '8/5';
        portfolio.innerHTML = `<portfolio-website-scene preview autoplay aria-label="Live interactive garment portfolio"></portfolio-website-scene><div class="ui-card-footer"><h2>Portfolio Website</h2><a href="/portfolio-website">View full page ↗</a></div>`;
        const previous = grid.querySelector('.card-plasma') || grid.querySelector('.card-visa') || grid.querySelector('.card-postage');
        grid.insertBefore(portfolio, previous ? previous.nextSibling : grid.querySelector('.card:not([class*="card-live"])'));
      }
      galleryCards = [...grid.children];
      layoutCards();
    }

    // Explicit masonry lanes keep scenes together and new components in lane two.
    function layoutCards() {
      const cards = galleryCards;
      const count = window.matchMedia('(min-width:900px)').matches ? 3 : window.matchMedia('(min-width:640px)').matches ? 2 : 1;
      const columns = Array.from({ length: count }, () => {
        const column = document.createElement('div');
        column.className = 'grid-column';
        return column;
      });
      const heights = Array(count).fill(0);
      const width = (grid.clientWidth - parseFloat(getComputedStyle(grid).paddingLeft) * 2 - 14 * (count - 1)) / count;
      cards.forEach(card => {
        const featured = card.classList.contains('card-live') || card.classList.contains('card-live-ui') || card.classList.contains('card-live-slider');
        const secondLane = card.classList.contains('card-postage') || card.classList.contains('card-visa');
        const thirdLane = card.classList.contains('card-plasma') || card.classList.contains('card-portfolio');
        const lane = count === 1 || featured ? 0 : secondLane ? 1 : thirdLane ? Math.min(2, count - 1) : heights.indexOf(Math.min(...heights));
        columns[lane].appendChild(card);
        const [w, h] = (card.dataset.ratio || (card.classList.contains('card-live-ui') ? '5/4' : '1/1')).split('/').map(Number);
        const height = card.classList.contains('card-live') ? 300 : width * h / w;
        heights[lane] += height + (featured || secondLane || thirdLane ? 44 : 0) + 14;
      });
      grid.replaceChildren(...columns);
    }
    for (const query of ['(min-width:640px)', '(min-width:900px)']) {
      window.matchMedia(query).addEventListener('change', layoutCards);
    }
    render('all');

    document.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render(btn.dataset.cat);
      });
    });

    document.querySelector('.header-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      btn.textContent = '✓ subscribed';
      btn.disabled = true;
    });
  </script>
</body>
</html>
