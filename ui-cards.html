<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f6">
  <meta name="description" content="A live carousel of curved, grainient UI cards with animated particle graphics.">
  <title>UI cards — Glasskit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
  <link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
  <script type="module" src="/src/ui-cards.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f2f5f6;color:#4c5863;font-family:Inter,system-ui,sans-serif}
    body{min-height:100svh;display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 28px;font-size:12px}
    a{color:inherit;text-decoration:none}
    a:hover{color:#111}
    a:focus-visible{outline:2px solid #626d7d;outline-offset:5px}
    h1{margin:0;font-size:12px;font-weight:500;color:#7d8790}
    main{display:grid;place-items:center;min-width:0;padding-bottom:32px}
    ui-cards-scene{width:min(100%,1100px,calc((100svh - 100px)*1.25))}
    @media(max-width:640px){header{padding:20px}main{padding-bottom:60px}ui-cards-scene{width:100%}}
  </style>
</head>
<body>
  <header><a href="/">← Glasskit</a><h1>UI cards</h1><a href="https://www.inspora.design/posts/ui-cards" target="_blank" rel="noopener noreferrer">Reference ↗</a></header>
  <main><ui-cards-scene aria-label="Interactive grainient UI cards carousel"></ui-cards-scene></main>
</body>
</html>
